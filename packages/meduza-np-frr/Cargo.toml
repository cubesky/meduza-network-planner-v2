[package]
name = "meduza-np-frr"
version = "0.1.0"
description = "Meduza NP FRR service plugin: iBGP/eBGP with explicit policy, BFD, Anycast OSPF with health guard"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "meduza-np-frr"
path = "src/main.rs"

[dependencies]
meduza-np-protocol.workspace = true
meduza-np-plugin-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
ipnet.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
