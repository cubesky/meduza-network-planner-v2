[package]
name = "meduza-np-mihomo-pkg"
version = "0.1.1"
description = "Meduza NP Mihomo binary provider: pinned GitHub Release download or manually copied file, verified and registered"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "meduza-np-mihomo-pkg"
path = "src/main.rs"

[dependencies]
meduza-np-protocol.workspace = true
meduza-np-plugin-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
sha2.workspace = true
hex.workspace = true
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
