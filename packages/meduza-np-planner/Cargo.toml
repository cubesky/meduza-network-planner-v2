[package]
name = "meduza-np-planner"
version = "0.1.0"
description = "Meduza NP node controller: registration, sync, plugin scheduling, supervision, ownership, recovery"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "meduza-np-planner"
path = "src/main.rs"

[dependencies]
meduza-np-protocol.workspace = true
meduza-np-plugin-sdk.workspace = true
meduza-np-runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64.workspace = true
sha2.workspace = true
hex.workspace = true
getrandom.workspace = true
ed25519-dalek.workspace = true
x25519-dalek.workspace = true
ipnet.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time", "process", "net", "io-util", "sync", "fs", "signal"] }
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time", "process", "net", "io-util", "sync", "fs", "test-util"] }
