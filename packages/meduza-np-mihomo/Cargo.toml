description = "Meduza NP Mihomo plugin: subscriptions, normalized configuration, TPROXY with loop protection, API status"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "meduza-np-mihomo"
path = "src/main.rs"

[dependencies]
meduza-np-protocol.workspace = true
meduza-np-plugin-sdk.workspace = true
