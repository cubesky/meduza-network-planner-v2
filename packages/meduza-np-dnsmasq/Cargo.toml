[package]
name = "meduza-np-dnsmasq"
version = "0.1.0"
description = "Meduza NP dnsmasq front-end DNS: fallback first, probed MosDNS/Mihomo backends, hosts, mDNS forwarding"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "meduza-np-dnsmasq"
path = "src/main.rs"

[dependencies]
meduza-np-protocol.workspace = true
meduza-np-plugin-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
