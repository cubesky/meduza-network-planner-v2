name: Release tool and public trust from plan
description: Use the tested release tool and verified public signing trust roots prepared by this run's plan job.
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with:
        name: release-tool
        path: target/release
    - shell: bash
      run: chmod +x target/release/meduza-np-release
    - uses: actions/download-artifact@v4
      with:
        name: release-trust
        path: packages/meduza-np-base-container/trust
