[workspace]
resolver = "2"
members = [
  "crates/protocol",
  "crates/plugin-sdk",
  "crates/runtime",
  "packages/meduza-np-planner",
  "packages/meduza-np-wireguard",
  "packages/meduza-np-cli",
  "packages/meduza-np-tinc",
  "packages/meduza-np-openvpn",
  "packages/meduza-np-frr",
  "packages/meduza-np-dnsmasq",
  "packages/meduza-np-mosdns",
  "packages/meduza-np-mihomo",
  "packages/meduza-np-mihomo-pkg",
  "packages/meduza-np-mihomo-openwrt",
  "packages/meduza-np-avahi",
  "packages/meduza-np-updater",
  "packages/meduza-np-dashboard",
  "tools/release",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/meduza-np/meduza-network-planner"
rust-version = "1.99"

[workspace.dependencies]
meduza-np-protocol = { path = "crates/protocol" }
meduza-np-plugin-sdk = { path = "crates/plugin-sdk" }
meduza-np-runtime = { path = "crates/runtime" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
getrandom = "0.2"
rand = { version = "0.8", default-features = false, features = ["std", "std_rng", "small_rng"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
httpdate = "1"
ipnet = { version = "2", features = ["serde", "schemars1"] }
schemars = "1"
tokio = { version = "1", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
